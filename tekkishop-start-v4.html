<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TEKKIShop — Parcours /start (prototype v3)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --bl:#2E90FA; --bld:#175CD3; --blp:#EFF6FF; --blb:#CFE2FF;
  --vt:#12B76A; --vtp:#ECFDF3; --vtb:#B9F0D3;
  --am:#F79009; --amp:#FFFAEB; --amb:#FEDF89;
  --gr:#5D6B82; --gr2:#8494AB; --ln:#E4EAF2; --nt:#0B1B32; --bg:#F6F8FC;
  --display:"Bricolage Grotesque","Inter",system-ui,sans-serif;
  --body:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--body);color:var(--nt);
  background:
    radial-gradient(circle at 78% 6%,rgba(46,144,250,.10),transparent 42%),
    radial-gradient(circle at 12% 92%,rgba(46,144,250,.07),transparent 44%),
    var(--bg);
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;                     /* la page défile si le contenu déborde */
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--bl);outline-offset:2px;border-radius:10px}

/* ---------- Ossature : une seule colonne centrée, mobile comme bureau ---------- */
.page{min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:0 20px;max-width:100%}
.wrap{width:100%;max-width:560px;min-height:100dvh;display:flex;flex-direction:column}

.head{padding:18px 0 12px;display:flex;align-items:center;gap:12px;flex:none}
.back{background:none;border:0;color:var(--gr);cursor:pointer;width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;flex:none;transition:background .16s}
.back:hover{background:var(--blp)}
.back svg{width:20px;height:20px}
.logo{font-family:var(--display);font-weight:800;font-size:1.08rem;letter-spacing:-.035em}
.logo span{color:var(--bl)}
.stepnum{margin-left:auto;font-size:.78rem;font-weight:700;color:var(--gr2)}
.bar{height:5px;background:var(--ln);border-radius:99px;overflow:hidden;flex:none}
.bar i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--bl),var(--bld));transition:width .45s cubic-bezier(.2,.8,.3,1)}

/* Corps : occupe l'espace libre, pousse le bouton en bas quand le contenu est court */
.body{flex:1;display:flex;flex-direction:column;padding:22px 0 8px;
  animation:in .34s cubic-bezier(.2,.8,.3,1)}
.body.mid{justify-content:center;text-align:center}
@keyframes in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.foot{flex:none;padding:12px 0 max(18px,env(safe-area-inset-bottom))}

h1{font-family:var(--display);font-size:clamp(1.85rem,4.4vw,2.5rem);font-weight:800;line-height:1.11;
  letter-spacing:-.038em;margin:0}
h2{font-family:var(--display);font-size:clamp(1.45rem,3.2vw,1.95rem);font-weight:800;line-height:1.15;
  letter-spacing:-.036em;margin:0 0 7px}
.sub{color:var(--gr);font-size:.96rem;line-height:1.5;margin:0 0 20px}
.bl{color:var(--bl)}
.spread{margin-top:auto}

/* ---------- Boutons ---------- */
.btn{width:100%;border:0;border-radius:15px;padding:17px;cursor:pointer;font-weight:800;font-size:1.03rem;
  display:flex;align-items:center;justify-content:center;gap:9px;
  transition:transform .18s,opacity .18s,box-shadow .18s}
.btn svg{width:19px;height:19px}
.btn-bl{background:var(--bl);color:#fff;box-shadow:0 10px 26px rgba(46,144,250,.32)}
.btn-vt{background:var(--vt);color:#fff;box-shadow:0 10px 26px rgba(18,183,106,.32)}
.btn-gh{background:#fff;color:var(--nt);border:2px solid var(--ln)}
.btn:not(.off):hover{transform:translateY(-2px)}
.btn.off{opacity:.36;pointer-events:none;box-shadow:none}
.linkish{display:block;text-align:center;margin-top:12px;font-size:.85rem;color:var(--gr);
  text-decoration:underline;cursor:pointer;background:none;border:0;width:100%}

/* ---------- Tuiles et lignes ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stack{display:flex;flex-direction:column;gap:9px}
.tile{border:2px solid var(--ln);border-radius:15px;background:#fff;padding:14px 8px;cursor:pointer;
  font-size:.86rem;font-weight:600;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:border-color .16s,background .16s,transform .16s}
.tile svg{width:22px;height:22px;color:var(--gr);transition:color .16s}
.tile:hover{transform:translateY(-2px)}
.tile.on{border-color:var(--bl);background:var(--blp)}
.tile.on svg{color:var(--bl)}
.tile .flag{font-size:1.6rem;line-height:1}
.row{border:2px solid var(--ln);border-radius:15px;background:#fff;padding:15px 17px;cursor:pointer;
  font-size:.95rem;font-weight:600;text-align:left;display:flex;align-items:center;gap:13px;
  transition:border-color .16s,background .16s,transform .16s}
.row svg{width:21px;height:21px;color:var(--gr);flex:none;transition:color .16s}
.row:hover{transform:translateY(-2px)}
.row.on{border-color:var(--bl);background:var(--blp)}
.row.on svg{color:var(--bl)}
.row b{display:block;font-size:.95rem;font-weight:700;line-height:1.3}
.row small{display:block;font-size:.81rem;color:var(--gr2);font-weight:500;margin-top:2px;line-height:1.4}
.row.on small{color:var(--gr)}

/* ---------- Champs ---------- */
.bigfield{width:100%;border:2px solid var(--ln);border-radius:15px;padding:17px;
  font-family:var(--display);font-size:1.22rem;font-weight:700;text-align:center;outline:none;
  transition:border-color .16s;background:#fff}
.bigfield:focus,.bigfield.ok{border-color:var(--bl)}
.hints{margin-top:11px;display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.hints span{border:1px solid var(--ln);border-radius:99px;padding:6px 13px;font-size:.78rem;color:var(--gr2);background:#fff}
.lab{display:block;font-size:.85rem;font-weight:700;margin-bottom:7px}

/* ---------- Micro-preuve ---------- */
.proof{background:var(--vtp);border:1px solid var(--vtb);border-radius:15px;padding:14px 15px;margin-top:18px;
  font-size:.89rem;line-height:1.5;animation:in .3s ease}

/* ---------- Révélation ---------- */
.kick{font-family:var(--mono);font-size:.68rem;letter-spacing:.17em;text-transform:uppercase;
  color:var(--bl);font-weight:600;margin-bottom:13px}
.note{background:var(--blp);border:1px solid var(--blb);border-radius:15px;padding:16px;margin-top:18px;text-align:left}
.note>b{font-size:.9rem}
.prep{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.prep li{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;font-weight:600}
.prep svg{width:18px;height:18px;color:var(--vt);flex:none;margin-top:2px}

/* ---------- Construction ---------- */
.spin{width:58px;height:58px;border-radius:50%;margin:0 auto;border:5px solid var(--blp);border-top-color:var(--bl);
  animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.buildlist{list-style:none;max-width:320px;margin:22px auto 0;padding:0;text-align:left}
.buildlist li{padding:9px 0;display:flex;gap:11px;align-items:center;font-size:.94rem;font-weight:600;
  color:#B4BFCF;transition:color .3s}
.buildlist li.done{color:var(--nt)}
.buildlist svg{width:18px;height:18px;flex:none}
.buildlist li:not(.done) svg{color:#D3DCEA}
.buildlist li.done svg{color:var(--vt)}

/* ---------- Carte boutique ---------- */
.shopcard{border:1px solid var(--ln);border-radius:19px;padding:20px;background:#fff;text-align:center;
  box-shadow:0 14px 36px rgba(11,27,50,.07)}
.shopcard .ico{width:58px;height:58px;border-radius:17px;background:var(--nt);color:#fff;margin:0 auto 11px;
  display:grid;place-items:center}
.shopcard .ico svg{width:26px;height:26px}
.shopcard h3{font-family:var(--display);font-size:1.3rem;font-weight:800;margin:0;letter-spacing:-.03em}
.shopcard .url{font-size:.83rem;color:var(--bld);font-weight:600;margin-top:3px;font-family:var(--mono)}
.badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.badges span{font-size:.71rem;font-weight:700;background:#F7F9FC;border:1px solid var(--ln);border-radius:99px;padding:5px 10px}
.gauge-lab{font-size:.8rem;font-weight:700;margin:14px 0 6px;color:var(--am)}
.gauge{height:8px;background:var(--ln);border-radius:99px;overflow:hidden}
.gauge i{display:block;height:100%;width:0;border-radius:99px;background:var(--vt);transition:width 1s cubic-bezier(.2,.8,.3,1)}
.missing{margin-top:13px;background:var(--amp);border:1px solid var(--amb);border-radius:13px;padding:12px 14px;
  font-size:.86rem;color:#7A4A02;line-height:1.5;text-align:left;display:flex;gap:10px}
.missing svg{width:19px;height:19px;flex:none;margin-top:1px;color:var(--am)}

/* ---------- Compte ---------- */
.phonerow{display:flex;gap:9px}
.dial{border:2px solid var(--ln);border-radius:15px;padding:0 14px;display:flex;align-items:center;gap:7px;
  font-weight:700;background:#fff;white-space:nowrap;font-size:.95rem}
.phonerow input{flex:1;border:2px solid var(--ln);border-radius:15px;padding:14px 15px;font-size:1.02rem;
  font-weight:600;outline:none;transition:border-color .16s;min-width:0;background:#fff}
.phonerow input:focus{border-color:var(--bl)}
.pin{display:flex;gap:8px}
.pin input{width:100%;height:56px;border:2px solid var(--ln);border-radius:13px;text-align:center;
  font-size:1.25rem;font-weight:700;outline:none;background:#fff;transition:border-color .16s;min-width:0}
.pin input:focus{border-color:var(--bl)}
.reassure{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:.79rem;color:var(--gr)}
.reassure span{display:flex;align-items:center;gap:5px}
.reassure svg{width:14px;height:14px;color:var(--vt)}

/* ---------- Produit ---------- */
.photo{width:100%;border:2px dashed #BCD4EA;border-radius:15px;padding:22px;display:grid;place-items:center;gap:6px;
  background:#FBFDFF;color:#4E82BC;font-size:.9rem;text-align:center;cursor:pointer;
  transition:border-color .16s,background .16s}
.photo:hover{border-color:var(--bl);background:var(--blp)}
.photo svg{width:26px;height:26px}
.photo small{color:var(--gr2)}
.thumbs{display:flex;gap:8px}
.thumbs i{flex:1;height:70px;border-radius:12px;display:block}
.thumbs .add{border:2px dashed #CFDCEA;display:grid;place-items:center;color:#9FB0C7;background:#fff}
.thumbs .add svg{width:18px;height:18px}
.field{margin-top:13px}
.field input{width:100%;border:2px solid var(--ln);border-radius:14px;padding:13px 15px;font-size:1rem;
  font-weight:600;outline:none;transition:border-color .16s;background:#fff}
.field input:focus{border-color:var(--bl)}
.duo{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.suffix{position:relative}
.suffix span{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:.83rem;
  color:var(--gr2);font-weight:600;pointer-events:none}
.suffix input{padding-right:62px}

/* ---------- En ligne ---------- */
.livecard{border:1px solid var(--ln);border-radius:18px;overflow:hidden;background:#fff;
  box-shadow:0 14px 36px rgba(11,27,50,.07)}
.livebar{background:#F4F7FC;border-bottom:1px solid var(--ln);padding:9px 12px;display:flex;align-items:center;gap:6px}
.livebar i{width:8px;height:8px;border-radius:50%;background:#D3DCEA}
.livebar .u{margin-left:7px;flex:1;background:#fff;border:1px solid var(--ln);border-radius:8px;
  padding:5px 10px;font-size:.7rem;color:var(--gr2);font-family:var(--mono);overflow:hidden;white-space:nowrap}
.livebody{padding:14px}
.livehead{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.livehead .av{width:38px;height:38px;border-radius:50%;background:var(--nt);color:#fff;display:grid;
  place-items:center;flex:none}
.livehead .av svg{width:18px;height:18px}
.livehead b{display:block;font-size:.93rem}
.livehead small{color:var(--gr2);font-size:.72rem;font-family:var(--mono)}
.liveprod{display:flex;gap:10px;align-items:center;border:1px solid var(--ln);border-radius:12px;padding:9px}
.liveprod i{width:50px;height:50px;border-radius:10px;flex:none}
.liveprod b{display:block;font-size:.86rem}
.liveprod span{font-size:.83rem;font-weight:700;font-family:var(--mono)}
.liveprod .voir{margin-left:auto;background:var(--nt);color:#fff;font-size:.7rem;font-weight:700;
  padding:6px 10px;border-radius:8px;flex:none}
.sharebtn{width:100%;border:2px solid var(--ln);background:#fff;border-radius:14px;padding:14px;
  display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;margin-top:9px;
  transition:border-color .16s,transform .16s}
.sharebtn:hover{transform:translateY(-2px);border-color:var(--blb)}
.sharebtn.main{border-color:var(--vtb);background:var(--vtp)}
.sharebtn svg{width:22px;height:22px;flex:none;color:var(--gr)}
.sharebtn.main svg{color:var(--vt)}
.sharebtn b{display:block;font-size:.92rem}
.sharebtn small{color:var(--gr2);font-size:.79rem}
.freebox{margin-top:15px;background:var(--amp);border:1px solid var(--amb);border-radius:14px;padding:13px 15px;
  font-size:.86rem;color:#7A4A02;line-height:1.5}
.dots{display:flex;gap:5px;margin-top:9px}
.dots i{flex:1;height:6px;border-radius:99px;background:var(--amb)}

/* ---------- Pays non couvert ---------- */
.altbox{border:1px solid var(--ln);border-radius:15px;background:#fff;padding:17px;margin-top:16px}
.altbox h4{font-family:var(--display);font-size:1rem;font-weight:800;margin:0 0 6px;letter-spacing:-.02em}
.altbox p{margin:0 0 12px;font-size:.87rem;color:var(--gr);line-height:1.5}
.altbox.licence{background:#0B1B32;border-color:#0B1B32;color:#fff}
.altbox.licence h4{color:#fff}
.altbox.licence p{color:#9FB3D4}
.altbox.licence .btn-gh{background:transparent;border-color:rgba(255,255,255,.25);color:#fff}
.sep{display:flex;align-items:center;gap:12px;margin:18px 0 4px;color:var(--gr2);font-size:.75rem;
  font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase}
.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--ln)}

@media (max-height:700px){
  .head{padding:12px 0 8px}
  .body{padding:16px 0 6px}
  h2{font-size:1.35rem}
  .sub{margin-bottom:14px;font-size:.9rem}
  .tile{padding:11px 6px}
  .row{padding:12px 15px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<div class="page">
  <div class="wrap">
    <div class="head">
      <button class="back" id="back" aria-label="Revenir en arrière" style="visibility:hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      </button>
      <span class="logo">TEKKI<span>Shop</span></span>
      <span class="stepnum" id="stepnum"></span>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div id="body" class="body"></div>
    <div id="foot" class="foot"></div>
  </div>
</div>

<script>
/* =========================================================================
   Icônes (style Lucide, au trait — aucun emoji dans l'interface)
   ========================================================================= */
const I = (d, extra) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
  stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const IC = {

  sparkle:I('<path d="M12 3v4M12 17v4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M3 12h4M17 12h4M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/>'),
  scissors:I('<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/>'),
  bag:    I('<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4H6Z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/>'),
  food:   I('<path d="M3 11h18M5 11a7 7 0 0 1 14 0M4 15h16a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3ZM6 6.5c0-1 1-1 1-2M10 6.5c0-1 1-1 1-2M14 6.5c0-1 1-1 1-2"/>'),
  book:   I('<path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15Z"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>'),
  phone:  I('<rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18.5h2"/>'),

  chat:   I('<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-4-.9L3 21l1.9-4.5A8.4 8.4 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3 8.5 8.5 0 0 1 21 11.5Z"/>'),
  camera: I('<path d="M14.5 4h-5L8 6.5H4.5A1.5 1.5 0 0 0 3 8v10.5A1.5 1.5 0 0 0 4.5 20h15a1.5 1.5 0 0 0 1.5-1.5V8a1.5 1.5 0 0 0-1.5-1.5H16L14.5 4Z"/><circle cx="12" cy="13" r="3.4"/>'),
  store:  I('<path d="M3 9 4.5 4h15L21 9M3 9h18M3 9v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V9M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/>'),
  pack:   I('<path d="M12 2 3 7v10l9 5 9-5V7l-9-5Z"/><path d="M7.5 4.5 16.5 9.5M3 7l9 5 9-5"/>'),
  rocket: I('<path d="M5 15c-1.5 1.5-2 6-2 6s4.5-.5 6-2a3 3 0 0 0-4-4Z"/><path d="M15 11a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/><path d="M9 15 7 13c0-6 4-10 10-10 0 6-4 10-10 10Z"/>'),
  target: I('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/>'),
  magnet: I('<path d="M6 4H3v7a9 9 0 0 0 18 0V4h-3v7a6 6 0 0 1-12 0V4Z"/><path d="M3 9h3M18 9h3"/>'),
  gear:   I('<circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 4.6a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 11a2 2 0 1 1 0 4Z"/>'),
  truck:  I('<path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18.5" r="1.8"/><circle cx="17.5" cy="18.5" r="1.8"/>'),
  wallet: I('<path d="M3 7a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v2"/><path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2Z"/><path d="M17.5 13.5h.01"/>'),

  stepnum.textContent = q >= 0 ? `Étape ${q + 1}/5` : '';

  const v = SCREENS[S.step]();
  bodyEl.className = 'body' + (v.mid ? ' mid' : '');
  bodyEl.innerHTML = v.body;
  footEl.innerHTML = v.foot || '';
  wire();

      ? `Pour un produit à télécharger, ton client reçoit le fichier <b>automatiquement</b> après avoir payé.`
      : `Le stock s'affiche sur ta boutique. Quand il reste peu d'articles, tes clients commandent plus vite.`}
  </div>`,
  foot:`<button class="btn btn-bl ${(!S.photo || S.prodNom.trim().length < 2 || !S.prodPrix) ? 'off' : ''}" data-go="11">
      Publier et mettre ma boutique en ligne</button>` }),

/* ---------- 11 · En ligne ---------- */
11: () => {
  const p = PARTAGE[canal()];
  return { body:`
  <h2>Ta boutique est <span class="bl">en ligne</span>.</h2>
  <p class="sub">Elle est publique dès maintenant. Tes clients peuvent commander et payer.</p>
  <div class="livecard">
    <div class="livebar"><i></i><i></i><i></i><div class="u">tekki.shop/${slug()}</div></div>
    <div class="livebody">
      <div class="livehead">
        <div class="av">${IC[catD().ic]}</div>
        <div><b>${esc(S.nom)}</b><small>tekki.shop/${slug()}</small></div>
      </div>
      <div class="liveprod">
        <i style="background:${catD().grad}"></i>
        <div><b>${esc(S.prodNom || catD().ex)}</b>
          <span>${money(S.prodPrix || '14000')} ${paysD().dev}</span></div>
        <span class="voir">Voir</span>
      </div>
    </div>
  </div>
  <button class="sharebtn main">${IC[p.ic]}<div><b>${p.titre}</b><small>${p.sous}</small></div></button>
  <button class="sharebtn">${IC.link}<div><b>Copier mon lien</b><small>tekki.shop/${slug()}</small></div></button>
  <div class="freebox">
    <b>Tes 3 premières commandes sont offertes.</b> Ensuite, tu choisis un plan pour continuer à recevoir des commandes.
    Tu ne paies donc qu'après avoir vendu.
    <div class="dots"><i></i><i></i><i></i></div>
  </div>`,
  foot:`<button class="btn btn-bl" data-go="0">Aller à mon tableau de bord ${IC.arrow}</button>` };
},
};

function proofNom(){
  return S.nom.trim().length >= 2
    ? `L'adresse de ta boutique sera <b>tekki.shop/${slug()}</b>. Choisis un nom court, que tes clients retiennent facilement.`
    : `Le nom de ta boutique deviendra son adresse : <b>tekki.shop/nom-de-ta-boutique</b>. Court et facile à retenir, c'est mieux.`;
}

/* =========================================================================
   Interactions
   ========================================================================= */
function wire(){
  document.querySelectorAll('[data-go]').forEach(b =>
    b.addEventListener('click', () => go(+b.dataset.go)));

  document.querySelectorAll('[data-set]').forEach(b =>
    b.addEventListener('click', () => {
      const k = b.dataset.set;
      S[k] = b.dataset.val;
      render();
    }));

  const dia = document.getElementById('toggleDia');
  if (dia) dia.addEventListener('click', () => { S.diaspora = !S.diaspora; S.pays = null; render(); });

  const nom = document.getElementById('nom');
  if (nom){
    setTimeout(() => nom.focus(), 160);
    nom.addEventListener('input', e => {
      S.nom = e.target.value;
      const ok = S.nom.trim().length >= 2;
      e.target.classList.toggle('ok', ok);
      document.getElementById('pf').innerHTML = proofNom();
      footEl.querySelector('[data-go="2"]').classList.toggle('off', !ok);
    });
    nom.addEventListener('keydown', e => { if (e.key === 'Enter' && S.nom.trim().length >= 2) go(2); });
  }

  /* Liste d'attente */
  const wp = document.getElementById('wp'), wt = document.getElementById('wt');
  function refreshWait(){
    const btn = document.getElementById('waitBtn');
    if (btn) btn.classList.toggle('off', S.waitPays.length < 3 || S.waitTel.replace(/\D/g,'').length < 8);
  }
  if (wp) wp.addEventListener('input', e => { S.waitPays = e.target.value; refreshWait(); });
  if (wt) wt.addEventListener('input', e => { S.waitTel = e.target.value; refreshWait(); });
  const waitBtn = document.getElementById('waitBtn');
  if (waitBtn) waitBtn.addEventListener('click', () => {
    waitBtn.innerHTML = IC.check + ' On te préviendra';
    waitBtn.classList.add('off');
  });

  /* Construction */
  if (S.step === 7){
    const items = document.querySelectorAll('#buildlist li');
    items.forEach((li,i) => setTimeout(() => {
      li.classList.add('done');
      li.querySelector('svg').outerHTML = IC.check;
    }, 480 + i * 620));
    setTimeout(() => go(8), 480 + items.length * 620 + 380);
  }

  /* Jauge */
  if (S.step === 8){
    const g = document.getElementById('g'), pct = document.getElementById('pct');
    setTimeout(() => {
      g.style.width = '80%';
      let n = 0;
      const iv = setInterval(() => { n += 4; pct.textContent = Math.min(n,80); if (n >= 80) clearInterval(iv); }, 38);
    }, 280);
  }

  /* Compte */
  const tel = document.getElementById('tel');
  function refreshAccount(){
    const btn = footEl.querySelector('[data-go="10"]');
    if (btn) btn.classList.toggle('off', S.tel.replace(/\D/g,'').length < 8 || S.pin.length < 6);
  }
  if (tel) tel.addEventListener('input', e => { S.tel = e.target.value; refreshAccount(); });

  const pinwrap = document.getElementById('pinwrap');
  if (pinwrap){
    const cells = [...pinwrap.querySelectorAll('input')];
    cells.forEach((c,i) => {
      c.addEventListener('input', e => {
        e.target.value = e.target.value.replace(/\D/g,'').slice(0,1);
        S.pin = cells.map(x => x.value).join('');
        if (e.target.value && cells[i+1]) cells[i+1].focus();
        refreshAccount();
      });
      c.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !e.target.value && cells[i-1]) cells[i-1].focus();
      });
    });
  }

  /* Produit */
  const addphoto = document.getElementById('addphoto');
  if (addphoto) addphoto.addEventListener('click', () => { S.photo = true; render(); });
  const pnom = document.getElementById('pnom'), pprix = document.getElementById('pprix');
  function refreshProduct(){
    const btn = footEl.querySelector('[data-go="11"]');
    if (btn) btn.classList.toggle('off', !S.photo || S.prodNom.trim().length < 2 || !S.prodPrix);
  }
  if (pnom) pnom.addEventListener('input', e => { S.prodNom = e.target.value; refreshProduct(); });
  if (pprix) pprix.addEventListener('input', e => {
    e.target.value = e.target.value.replace(/\D/g,'');
    S.prodPrix = e.target.value; refreshProduct();
  });
}

render();
</script>
</body>
</html>
